<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f62fe">

    <title>Sistema de Demandas</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="app">
        <header class="topo">
            <img src="icons/icon-192.png" alt="" class="app-icon">
            <h1>Sistema de Demandas</h1>
        </header>

        <section class="painel" aria-labelledby="titulo-cadastro">
            <h2 id="titulo-cadastro">Nova Demanda</h2>

            <form id="formDemanda" autocomplete="off">
                <label>
                    N° de Demanda
                    <input type="text" id="numero" required>
                </label>

                <label>
                    Nome do Beneficiário
                    <input type="text" id="beneficiario" required>
                </label>

                <label>
                    Regional
                    <select id="regional" required>
                        <option value="">Selecione</option>
                        <option value="ABC">ABC</option>
                        <option value="Campinas">Campinas</option>
                        <option value="Sorocaba">Sorocaba</option>
                        <option value="Baixada Santista">Baixada Santista</option>
                        <option value="Americana">Americana</option>
                        <option value="Nacional">Nacional</option>
                    </select>
                </label>

                <label>
                    Assunto
                    <input type="text" id="assunto" required>
                </label>

                <label>
                    Vencimento
                    <input type="date" id="vencimento" required>
                </label>

                <button type="submit">Cadastrar</button>
            </form>
        </section>

        <section class="painel" aria-labelledby="titulo-lista">
            <h2 id="titulo-lista">Demandas</h2>

            <div class="filtros">
                <label>
                    Pesquisar
                    <input type="search" id="pesquisa" placeholder="Nome do beneficiário">
                </label>

                <label>
                    Regional
                    <select id="filtroRegional">
                        <option value="">Todas</option>
                        <option value="ABC">ABC</option>
                        <option value="Campinas">Campinas</option>
                        <option value="Sorocaba">Sorocaba</option>
                        <option value="Baixada Santista">Baixada Santista</option>
                        <option value="Americana">Americana</option>
                        <option value="Nacional">Nacional</option>
                    </select>
                </label>

                <label>
                    Status
                    <select id="filtroStatus">
                        <option value="">Todos</option>
                        <option value="Em andamento">Em andamento</option>
                        <option value="Próxima de vencer">Próxima de vencer</option>
                        <option value="Concluída">Concluída</option>
                    </select>
                </label>

                <label>
                    Conclusão
                    <select id="filtroConclusao">
                        <option value="">Todas</option>
                        <option value="Pendente">Pendente</option>
                        <option value="Concluída">Concluída</option>
                    </select>
                </label>
            </div>

            <table class="tabela-demandas">
                <thead>
                    <tr>
                        <th>N° de Demanda</th>
                        <th>Nome do Beneficiário</th>
                        <th>Regional</th>
                        <th>Assunto</th>
                        <th>Conclusão</th>
                        <th>Data da Demanda</th>
                        <th>Status</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="listaDemandas"></tbody>
            </table>
        </section>
    </main>

    <div class="popup" id="popup" hidden>
        <div class="popup-caixa" role="dialog" aria-modal="true" aria-labelledby="popupTitulo">
            <h2 id="popupTitulo">Pendente</h2>
            <p id="popupMensagem"></p>
            <button type="button" id="fecharPopup">OK</button>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
