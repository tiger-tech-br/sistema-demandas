apply plugin: 'com.android.application'

def releaseSigningPropertiesFile = rootProject.file('keystore/keystore.properties')
def releaseSigningProperties = new Properties()
if (releaseSigningPropertiesFile.isFile()) {
    releaseSigningPropertiesFile.withInputStream { releaseSigningProperties.load(it) }
}

android {
    namespace = "com.viviani.sistemademandas"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.viviani.sistemademandas"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 7
        versionName "1.5"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseSigningPropertiesFile.isFile()) {
                storeFile rootProject.file(releaseSigningProperties.getProperty('storeFile'))
                storePassword releaseSigningProperties.getProperty('storePassword')
                keyAlias releaseSigningProperties.getProperty('keyAlias')
                keyPassword releaseSigningProperties.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

tasks.register('copyCurrentWebAssets', Sync) {
    from "${rootProject.projectDir}/../web/dist"
    into "${projectDir}/src/main/assets/public"
    doFirst {
        if (!file("${rootProject.projectDir}/../web/dist/index.html").isFile()) {
            throw new GradleException("A interface web ainda nao foi compilada. Execute npm run build na raiz antes de gerar o APK.")
        }
    }
}

tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    doFirst {
        if (!releaseSigningPropertiesFile.isFile()) {
            throw new GradleException('Assinatura de producao ausente: configure android/keystore/keystore.properties conforme docs/ANDROID-RELEASE.md.')
        }
        ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each { property ->
            if (!releaseSigningProperties.getProperty(property)) {
                throw new GradleException("Propriedade de assinatura de producao ausente: ${property}.")
            }
        }
    }
}

afterEvaluate {
    tasks.named('preBuild').configure {
        dependsOn tasks.named('copyCurrentWebAssets')
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
